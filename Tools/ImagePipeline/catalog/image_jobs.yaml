    width: 1024
    height: 3072
    force_single: true
    skip_style_prefix: true
    scale: 58
    min_ratio: 0.25
    max_ratio: 4.0
    prompt: >
      Chilly Snow endless scroll background, strip C.
      Same low-poly faceted snow mountain style as reference: sharp snow planes, matte clay look, soft daylight.
