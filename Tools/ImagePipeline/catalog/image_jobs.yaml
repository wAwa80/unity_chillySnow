  # ---------- 长局/无尽：75°俯视低面雪山竖条（方案 C v2）----------
  # 最终提示词核心：低面几何雪山 + 75°前上方俯视 + 仅雪山与蓝天
  # 跑法：python scripts/generate.py --force --only bg_snow_mountain_75_01
  - id: bg_snow_mountain_75_01
    filename: bg_snow_mountain_75_01.png
    width: 1024
    height: 3072
    force_single: true
    skip_style_prefix: true
    scale: 58
    min_ratio: 0.25
    max_ratio: 4.0
    prompt: >
      Chilly Snow endless scroll background, strip A.
      Low-poly 3D snow mountain ONLY, match reference mountain: sharp geometric triangular facets,
      matte clay snow, soft daylight, cool blue shadows, cream-white highlights.
      Camera: 75-degree high bird's-eye from front-above, looking down the snow ridges; tall vertical frame.
      Scene: only snow-covered mountain peaks/ridges + clear pale blue sky. Continuous descending ridge forms for stitch.
      FORBIDDEN: trees, forest, skier, people, orange props, red ball, UI, text, buttons, collage.
      Single tall image.
    refs:
      - path: Assets/TestImage/concept_refs/g_ref_lowpoly_snow_mountain.png
      - path: Assets/TestImage/concept_refs/g2_01_snow_mountain.png
      - path: Assets/TestImage/concept_refs/g4_01_lowpoly_slope.png

  - id: bg_snow_mountain_75_02
    filename: bg_snow_mountain_75_02.png
    width: 1024
    height: 3072
    force_single: true
    skip_style_prefix: true
    scale: 58
    min_ratio: 0.25
    max_ratio: 4.0
    prompt: >
      Chilly Snow endless scroll background, strip B.
      Same low-poly faceted snow mountain style as reference: geometric planes, soft sun, blue-tinted snow shadows.
      Camera: 75-degree front-above bird's-eye over mid ridge section; tall vertical composition.
      Scene: only snow mountains + clear pale blue sky. Slightly denser ridge folds than strip A, same lighting.
      FORBIDDEN: trees, forest, skier, people, orange props, red ball, UI, text, buttons, collage.
      Identical art style to strip A/C. Single tall image.
    refs:
      - path: Assets/TestImage/concept_refs/g_ref_lowpoly_snow_mountain.png
      - path: Assets/TestImage/concept_refs/g2_01_snow_mountain.png
      - path: Assets/TestImage/concept_refs/g4_01_lowpoly_slope.png

  - id: bg_snow_mountain_75_03
