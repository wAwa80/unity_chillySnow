    width: 936
    height: 1664
    force_single: true
    scale: 52
    prompt: >
      Chilly Snow 无尽局外首页，单张。角色必须是青绿色小球，禁止人物。
      顶左橙设置、顶右绿去广告；顶中 Best 皇冠分，无关卡条。
      中央小球+大字 TAP TO PLAY 主焦点；底左橙 MODE、底右绿 SKINS，次级留白。
      勿六宫格顶栏、勿三钮挤底。奶油雪坡极简松树。
